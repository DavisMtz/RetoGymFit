<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="RETO GYM" />
    <title>RETO GYM 2026</title>
    <!-- Vista previa al compartir la app (los posts tienen la suya propia,
         servida por la función `ogpost` en /p/{reto}/{id}) -->
    <meta property="og:site_name" content="RetoGymFit" />
    <meta property="og:title" content="RETO GYM 2026 — Más fuerte que ayer" />
    <meta property="og:description" content="Registra tus entrenamientos, defiende tu racha y compite por el bote con tu equipo." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://retogymfit.web.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Tipografías self-hosted (src/styles/fonts.css → /public/fonts):
         identidad garantizada aun sin conexión, sin depender de Google Fonts. -->
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
